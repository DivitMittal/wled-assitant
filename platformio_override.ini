# wled-assitant — PlatformIO override for upstream WLED v16.0.1
# scripts/bootstrap.sh symlinks this file into wled/platformio_override.ini.
# Build:  cd wled && pio run -e wled_assitant_s3_supermini

[platformio]
default_envs = wled_assitant_s3_supermini

# ------------------------------------------------------------------------------
# Single source of truth for the soldered wiring. Everything else derives from it.
# ------------------------------------------------------------------------------
[wled_assitant]
led_data_pin = 6     ; ESP32-S3 -> TXS0108E A7 -> B7 -> 220R -> WS2812B DIN
txs_oe_pin   = 7     ; ESP32-S3 -> TXS0108E OE (10k pull-down to GND)
i2c_scl_pin  = 8     ; HTU21D SCL
i2c_sda_pin  = 9     ; HTU21D SDA
led_count    = 144
abl_max_ma   = 7000  ; WLED current limiter default (still editable in LED Preferences)

pin_flags =
  -D DATA_PINS=${wled_assitant.led_data_pin}
  -D PIXEL_COUNTS=${wled_assitant.led_count}
  -D WLEDA_LED_DATA_PIN=${wled_assitant.led_data_pin}
  -D WLEDA_TXS_OE_PIN=${wled_assitant.txs_oe_pin}
  -D I2CSCLPIN=${wled_assitant.i2c_scl_pin}
  -D I2CSDAPIN=${wled_assitant.i2c_sda_pin}

# ------------------------------------------------------------------------------
# ESP32-S3 SuperMini (ESP32-S3FH4R2: 4 MB quad flash, 2 MB quad PSRAM in package)
# Extends upstream esp32s3_4M_qspi, whose board (lolin_s3_mini) uses the same
# S3FH4R2 chip and sets ARDUINO_USB_MODE=1 (USB-Serial/JTAG = HWCDC).
# ------------------------------------------------------------------------------
[env:wled_assitant_s3_supermini]
extends = env:esp32s3_4M_qspi
; replaces upstream's audioreactive default; the path is relative to the wled/ project dir
custom_usermods =
  wled-assitant = symlink://../usermods/wled_assitant
upload_speed = 921600
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32-S3_SuperMini_wled-assitant\"
  -D ARDUINO_USB_MODE=1            ; USB-Serial/JTAG peripheral (HWCDC), not TinyUSB/OTG
  -D ARDUINO_USB_CDC_ON_BOOT=1     ; Serial == USB port -> WLED Adalight reads the USB port
  -D BOARD_HAS_PSRAM
  -D LOLIN_WIFI_FIX                ; lower TX power; SuperMini antennas behave like LOLIN S3 mini
  -D WLED_WATCHDOG_TIMEOUT=0
  ${wled_assitant.pin_flags}
  -D ABL_MILLIAMPS_DEFAULT=${wled_assitant.abl_max_ma}
  -D LED_MILLIAMPS_DEFAULT=55
  -D SERVERNAME=\"Desk\ Ambient\ Light\"
  -D WLEDA_USB_RX_BUFFER=2048
; Optional: debug log over UDP instead of the USB port shared with HyperHDR
; (receive with `nc -kul 7868`). Never enable plain WLED_DEBUG on this build.
;  -D WLED_DEBUG -D WLED_DEBUG_HOST=\"192.168.1.10\"
